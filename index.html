<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Resume Tailor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom scrollbar for a more polished look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1f2937; /* bg-gray-800 */
      }
      ::-webkit-scrollbar-thumb {
        background: #4b5563; /* bg-gray-600 */
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6b7280; /* bg-gray-500 */
      }

      /* Custom styles for the classic resume preview */
      .resume-container {
        font-family: Georgia, 'Times New Roman', Times, serif;
        color: #111827; /* text-gray-900 */
        font-size: 11pt;
        line-height: 1.4;
      }
      .resume-container h1 {
        text-align: center;
        font-size: 26pt;
        font-weight: 600;
        margin-bottom: 0.5rem;
        padding-bottom: 2px;
      }
      /* Contact info */
      .resume-container h1 + p {
        text-align: center;
        font-size: 10.5pt;
        margin-bottom: 1rem;
      }
      .resume-container h2 {
        font-size: 11pt;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-top: 1.25rem;
        margin-bottom: 0.5rem;
        border-bottom: 1.5px solid #000;
        padding-bottom: 4px;
      }
      .resume-container p {
        margin: 0;
        padding: 0;
        margin-bottom: 2px; /* Small space between lines */
      }
      .resume-container strong {
        font-weight: 600;
      }
      .resume-container em {
        font-style: italic;
      }
      .resume-container ul {
        list-style-type: disc;
        list-style-position: outside;
        padding-left: 24px; /* Indent bullet points */
        margin-top: 0.5rem;
        margin-bottom: 0.75rem;
      }
      .resume-container ul:last-child {
        margin-bottom: 0;
      }
      .resume-container ul li {
        padding-left: 4px;
        margin-bottom: 5px;
      }
      /* Two-column layout entry */
      .entry {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .entry .entry-left {
        text-align: left;
        padding-right: 1rem;
      }
      .entry .entry-right {
        text-align: right;
        white-space: nowrap;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1",
    "html2canvas": "https://aistudiocdn.com/html2canvas@^1.4.1",
    "jspdf": "https://aistudiocdn.com/jspdf@^3.0.3",
    "remark-gfm": "https://aistudiocdn.com/remark-gfm@^4.0.1",
    "pdfjs-dist": "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
  }
}
</script>
</head>
  <body class="bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
